<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if student %}<title>Update Student</title>{% else %}<title>Register Student</title>{% endif %}
</head>
<body>
    {% if student %}
        <h1>Update Student Information</h1>
    {% else %}
        <h1>Register a New Student</h1>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label for="first_name">First Name:</label>
            
            <input type="text" name="first_name" id="first_name" {% if student %} value="{{student.first_name|default:""}}" {% endif %} required>
        </p>
        <p>
            <label for="last_name">Last Name:</label>
            <input type="text" name="last_name" id="last_name"  {% if student %} value="{{student.last_name|default:""}}" {% endif %} required>
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" {% if student %} value="{{student.email|default:""}}" {% endif %} required>
        </p>
        <p>
            <label for="age">Age:</label>
            <input type="number" name="age" id="age" {% if student %} value="{{student.age|default:""}}" {% endif %} required>
        </p>
        <p>
            <label for="level">Level:</label>
            <input type="number" name="level" id="level" {% if student %} value="{{student.level|default:""}}" {% endif %} required>
        </p>
        {% if student %}
        <button type="submit">Update</button>
        {% else %}
        <button type="submit">Register</button>
        {% endif %}
        
    </form>
</body>
</html>
