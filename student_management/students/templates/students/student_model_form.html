<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student</title>
</head>
<body>
    {% if student %}
        <h1>Update Student Information</h1>
    {% else %}
        <h1>Register a New Student</h1>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Register Student</button>
    </form>
</body>
</html>
