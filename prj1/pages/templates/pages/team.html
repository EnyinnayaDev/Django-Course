<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>{{ title }}</h1>
    <ul>
        {% for team in team_members %}
            <li>{{ team.name }} - {{ team.role }} - Experience: {{ team.Experience }} years 
                {% if team.Lead%}
                    (Team Lead)
                {% endif %}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
